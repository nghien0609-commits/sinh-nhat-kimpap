<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lộc chan 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>

    <main class="container">
        <!-- MÀN HÌNH ĐẾM NGƯỢC -->
        <section id="countdownScreen" class="screen active">
            <div class="moon">🌙 ✨</div>
            <p class="small-text">Một điều bất ngờ dành cho</p>
            <h1 class="name">Lộc chan 💗</h1>
            <div id="countdown" class="countdown">3</div>
            <p>Chuẩn bị nhận quà nhé!</p>
        </section>

        <!-- MÀN HÌNH LỜI CHÚC -->
        <section id="wishScreen" class="screen">
            <div class="gift">🎁</div>
            <p class="small-text">Hôm nay là ngày đặc biệt...</p>
            <h1>Happy Birthday!</h1>
            <h2>Lộc chan 🎂</h2>

            <div class="letter">
                <p id="wishText">
                    Chúc mừng sinh nhật Lộc chan!
                </p>
            </div>

            <div class="dots" id="wishDots">♡ ♡ ♡</div>
            <button id="nextWishBtn">Đọc tiếp 💌</button>
        </section>

        <!-- MÀN HÌNH BÁNH SINH NHẬT -->
        <section id="cakeScreen" class="screen">
            <p class="small-text">Điều ước của cậu đang chờ...</p>
            <h1>Ước một điều nhé! ✨</h1>

            <div class="cake-area">
                <div class="candle-row">
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>

                <div class="cake-top">
                    <span>🍓</span> <span>💗</span> <span>🍓</span>
                </div>
                <div class="cake-middle">
                    Happy Birthday<br>Lộc chan
                </div>
                <div class="cake-bottom"></div>
                <div class="plate"></div>
            </div>

            <p id="cakeMessage">
                Nhắm mắt, ước một điều rồi thổi nến nha! 💕
            </p>

            <button id="blowBtn">🌬️ Thổi tắt nến</button>
            <button id="micBtn" class="secondary">
                🎤 Thổi bằng micro
            </button>
            <p id="micStatus" class="small-text"></p>

            <button id="againBtn" class="secondary hidden">
                💖 Xem lại từ đầu
            </button>
        </section>
    </main>

    <div id="confetti"></div>

    <script src="script.js"></script>
</body>
</html>
